name: Build Arch Linux binary

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest

    steps:
      - name: Install Git
        run: pacman -Syu --noconfirm --needed git

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether tagged commit belongs to main
        id: main_tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Tagged commit is not contained in main; skipping build."
          fi

      - name: Install build tools
        if: steps.main_tag.outputs.build == 'true'
        run: pacman -S --noconfirm --needed base-devel rust cargo github-cli

      - name: Run tests
        if: steps.main_tag.outputs.build == 'true'
        run: cargo test --locked

      - name: Build release binary
        if: steps.main_tag.outputs.build == 'true'
        run: cargo build --release --locked

      - name: Build Arch package
        if: steps.main_tag.outputs.build == 'true'
        id: package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          package_version="${GITHUB_REF_NAME#v}"
          runuser -u builder -- sh -c 'cd "$1" && env PKGVER="$2" makepkg --cleanbuild --nodeps --noconfirm' sh "$GITHUB_WORKSPACE/packaging/arch" "$package_version"
          package_file=$(find "$GITHUB_WORKSPACE/packaging/arch" -maxdepth 1 -type f -name 'lazymenu-cli-*.pkg.tar.zst' -print -quit)
          test -n "$package_file"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Publish release package
        if: steps.main_tag.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.package_file }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.package_file }}" --generate-notes --verify-tag
          fi
